<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--base:#05060f;--ink:#e9ecff;--ink2:#a9b0d6;--ink3:#6c74a3;--glass:rgba(14,18,46,.86);--line:rgba(160,170,255,.16);--accent:#b79cff;--halo:#0b1030;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--base);color:var(--ink);font-family:var(--sans);overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#svg.dragging{cursor:grabbing}
#svg .it{cursor:pointer}
#svg .deco,#svg #overlay,#svg #Lfx,#svg #Lstars{pointer-events:none}
#svg .edge .line,#svg .edge .head,#svg .edge .elab{pointer-events:none}
header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:14px 20px 22px;pointer-events:none;z-index:5;background:linear-gradient(color-mix(in srgb,var(--base) 92%,transparent),color-mix(in srgb,var(--base) 55%,transparent) 60%,transparent)}
header h1{margin:0;font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:.3px;white-space:nowrap}
header .sub{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
nav{margin-left:auto;display:flex;gap:6px;pointer-events:auto;align-items:center;flex-shrink:0}
nav button,.btn{background:color-mix(in srgb,var(--ink) 7%,transparent);border:1px solid var(--line);color:var(--ink);font:500 13px var(--sans);padding:8px 13px;border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s}
nav button:hover,.btn:hover{background:color-mix(in srgb,var(--ink) 13%,transparent)}
nav button.on{background:color-mix(in srgb,var(--accent) 24%,transparent);border-color:color-mix(in srgb,var(--accent) 65%,transparent)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 12px}
#live{font:500 12px var(--sans);color:var(--ink3);display:flex;align-items:center;gap:6px;padding:0 4px}
#live::before{content:"";width:8px;height:8px;border-radius:50%;background:#777}
#live.on{color:var(--ink2)}#live.on::before{background:#5ef0a0;box-shadow:0 0 8px #5ef0a0}
.btn:disabled{opacity:.35;cursor:default}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.legend{position:fixed;z-index:5;display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:12px 14px;transition:opacity .3s;font-size:13px;color:var(--ink2)}
.legend.row{flex-direction:row;flex-wrap:wrap;gap:12px;padding:10px 14px;font-size:12px}
.legend.bottom-left{left:18px;bottom:18px}.legend.bottom-right{right:18px;bottom:18px}.legend.top-left{left:18px;top:72px}.legend.top-right{right:18px;top:72px}
.legend .t{font:600 11px var(--sans);letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.le{display:flex;align-items:center;gap:8px;user-select:none}
.le.tog{cursor:pointer}.le.off{opacity:.35}
.le i{width:22px;height:3px;border-radius:2px;display:inline-block}
.le b{width:9px;height:9px;border-radius:50%;display:inline-block}
body.touring .legend,body.panel-open .legend.bottom-right{opacity:0;pointer-events:none}
#panel,#insp{position:fixed;top:66px;right:18px;width:min(400px,calc(100vw - 36px));max-height:calc(100vh - 150px);overflow:auto;z-index:6;border-radius:18px;padding:20px 22px}
#panel{transform:translateX(120%);transition:transform .35s ease}
#panel.open{transform:none}
#panel h2{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;margin:4px 0 10px;padding-right:18px}
#panel .q{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink);opacity:.92;line-height:1.35;margin:0 0 14px}
#panel p{font-size:14px;line-height:1.55;color:var(--ink2);margin:0 0 12px;white-space:pre-line}
#panel p.path{font:12px var(--mono);color:var(--ink2);background:color-mix(in srgb,var(--ink) 6%,transparent);padding:6px 8px;border-radius:8px;word-break:break-word}
.lab{font:600 11px var(--sans);letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);margin:14px 0 4px}
.lab.k{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
.chip.go{cursor:pointer}.chip.go:hover{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink)}
.x{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--ink2);font-size:22px;cursor:pointer;line-height:1}
#insp{padding:16px 18px;width:min(340px,calc(100vw - 36px))}
#insp .pr{display:flex;align-items:baseline;gap:9px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13.5px}
#insp .pr:last-of-type{border-bottom:0}
#insp .pr b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--base);font:700 11.5px/20px var(--sans);text-align:center;transform:translateY(4px)}
#insp .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#insp code{font:11.5px var(--mono);color:var(--ink3)}
#insp .tip{margin-top:10px;font-size:12.5px;line-height:1.5;color:var(--ink2)}
#insp .tip em{font-style:normal;color:var(--ink)}
#ehint{position:fixed;right:18px;top:66px;z-index:4;max-width:290px;border-radius:14px;padding:11px 14px;font-size:12.5px;line-height:1.5;color:var(--ink2);pointer-events:none;transition:opacity 1.2s}
#ehint b{color:var(--ink);font-weight:600}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,160%);z-index:8;display:flex;align-items:center;gap:10px;border-radius:14px;padding:9px 12px 9px 16px;max-width:min(860px,calc(100vw - 36px));font-size:13px;transition:transform .35s ease,opacity .35s,visibility .35s;opacity:0;visibility:hidden}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#toast .who{font:600 11px var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--accent);white-space:nowrap}
#toast .said{font:italic 15px var(--serif);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
#toast code{font:12px var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#toast .v{font:11px var(--mono);color:var(--ink3)}
#toast.err .who{color:#ff7a7a}
#toast button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:4px 10px;font:500 12px var(--sans);cursor:pointer}
body.touring #toast{bottom:auto;top:70px;transform:translate(-50%,-300%)}body.touring #toast.show{transform:translate(-50%,0)}
#cmdbar{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:9;width:min(720px,calc(100vw - 36px));border-radius:16px;padding:10px 12px}
#cmd{width:100%;background:transparent;border:0;outline:0;color:var(--ink);font:15px var(--mono);padding:6px 4px}
#cmdout{font:12.5px var(--mono);white-space:pre-wrap;color:var(--ink2);max-height:40vh;overflow:auto;margin:0 4px 6px}
#cmdout.err{color:#ff8f8f}
#cmdbar .h{font-size:11.5px;color:var(--ink3);margin:2px 4px 0}
#tour{position:fixed;left:50%;bottom:22px;transform:translate(-50%,150%);width:min(640px,calc(100vw - 36px));z-index:7;border-radius:18px;padding:18px 22px;transition:transform .4s ease}
#tour.open{transform:translate(-50%,0)}
#tour .n{font:600 11px var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--ink3)}
#tour h3{font-family:var(--serif);font-weight:600;font-size:24px;margin:4px 0 8px}
#tour p{margin:0 0 12px;color:var(--ink2);line-height:1.55;font-size:14.5px}
#tour .row{display:flex;gap:8px;justify-content:flex-end}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
.twinkle{animation:tw 7s ease-in-out infinite}
@keyframes fl{to{stroke-dashoffset:-121}}
.flow{animation:fl 8s linear infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:1;stroke-width:3}100%{transform:scale(2.8);opacity:0;stroke-width:.6}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.25s ease-out forwards}
@keyframes edgeflash{0%,60%{opacity:1}100%{opacity:inherit}}
.edge.flash{animation:edgeflash 1.4s ease-out}
.edge.flash .line{stroke-width:4px}
.it{transition:opacity .45s}
.it.faded{opacity:.22!important}
.edge.low{opacity:.1!important}.edge.lit{opacity:1!important}
.focusing .node.dim{opacity:.28!important}.focusing .edge.dim{opacity:.08!important}.focusing .region,.focusing .text{opacity:.32!important}
body.static *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){.twinkle,.flow{animation:none}}
@media (max-width:760px){header .sub{display:none}.legend{display:none}}
</style>
</head>

<script>window.STUDIO_EMBED={"scene": {"title": "Research World", "subtitle": "the problems I work on, and the roads between them", "theme": "night", "settings": {"canvas": [1600, 1000], "labels": true, "starfield": true, "legend": true, "back": {"href": "index.html", "label": "← Ali Parsaee"}}, "items": [{"id": "al", "type": "region", "label": "Active Learning", "x": 800, "y": 185, "r": 300, "shape": "glow", "color": "indigo", "lx": 0, "ly": -154, "labelSize": 30, "tags": ["field"], "info": {"kicker": "Field", "body": "Choosing which data to label or buy next."}}, {"id": "rl", "type": "region", "label": "Bandits & RL", "x": 1160, "y": 343, "r": 300, "shape": "glow", "color": "sky", "lx": 152, "ly": -69, "labelSize": 30, "tags": ["field"], "info": {"kicker": "Field", "body": "Acting in order to learn; exploration versus exploitation."}}, {"id": "minds", "type": "region", "label": "Minds & Agents", "x": 1160, "y": 658, "r": 300, "shape": "glow", "color": "pink", "lx": 152, "ly": 81, "labelSize": 30, "tags": ["field"], "info": {"kicker": "Field", "body": "How humans and AI agents learn, remember and work together."}}, {"id": "hier", "type": "region", "label": "Hierarchy & Abstraction", "x": 800, "y": 815, "r": 300, "shape": "glow", "color": "lavender", "lx": 0, "ly": 168, "labelSize": 30, "tags": ["field"], "info": {"kicker": "Field", "body": "Levels, structure, and how problems and compute decompose."}}, {"id": "causal", "type": "region", "label": "Causal Inference", "x": 440, "y": 658, "r": 300, "shape": "glow", "color": "green", "lx": -152, "ly": 93, "labelSize": 30, "tags": ["field"], "info": {"kicker": "Field", "body": "What happens when we intervene: effects and policies."}}, {"id": "surv", "type": "region", "label": "Survival Analysis", "x": 440, "y": 343, "r": 300, "shape": "glow", "color": "peach", "lx": -152, "ly": -79, "labelSize": 30, "tags": ["field"], "info": {"kicker": "Field", "body": "Learning from time-to-event data where many outcomes are censored."}}, {"id": "question", "type": "text", "text": "What is worth observing,\nwhen feedback is slow,\ncostly or incomplete?", "x": 800, "y": 494, "size": 21, "font": "serif", "italic": true, "color": "cream", "glow": true, "glowColor": "gold", "glowR": 120, "tags": []}, {"id": "bbsurv", "type": "node", "label": "Budgeted de-censoring", "x": 553, "y": 180, "shape": "star", "color": "amber", "size": 1.5, "tags": ["rev", "al", "surv", "censor", "budget", "info"], "info": {"kicker": "under review", "q": "Which patients’ follow-up is worth buying, and for how long?", "body": "My master's thesis with Russell Greiner and Bei Jiang. The method ranks patient–duration choices by expected information per unit of expected cost, with a (1−1/e) guarantee for the batch objective. arXiv 2510.12144, under review.", "chips": [["Fields", ["Active Learning", "Survival Analysis"]], ["Roads", ["Censoring", "Budget & cost", "Information"]]]}}, {"id": "cape", "type": "node", "label": "Survival-policy identification", "x": 575, "y": 443, "shape": "star", "color": "mint", "size": 1.4, "tags": ["prog", "rl", "causal", "surv", "censor", "interv", "budget", "info"], "info": {"kicker": "in progress", "q": "Which experiments should a limited budget buy to find the best treatment policy when outcomes are censored?", "body": "Pure exploration for a treatment recommendation: when outcomes are censored, the value of an experiment depends on how likely its result is to be observed, relative to its cost. In preparation.", "chips": [["Fields", ["Bandits & RL", "Causal Inference", "Survival Analysis"]], ["Roads", ["Censoring", "Intervention", "Budget & cost", "Information"]]]}}, {"id": "flag", "type": "node", "label": "Patients versus time", "x": 659, "y": 367, "shape": "star", "color": "violet", "size": 1.6, "tags": ["open", "rl", "surv", "causal", "censor", "budget", "explore"], "info": {"kicker": "open question", "q": "Recruit more patients, or wait longer for their outcomes?", "body": "The direction I am building toward: a trial must trade breadth (more patients) against depth (longer follow-up). An open problem.", "chips": [["Fields", ["Bandits & RL", "Survival Analysis", "Causal Inference"]], ["Roads", ["Censoring", "Budget & cost", "Exploration"]]]}}, {"id": "iid", "type": "node", "label": "The honesty–learning frontier", "x": 923, "y": 308, "shape": "star", "color": "violet", "size": 1.3, "tags": ["open", "al", "rl", "causal", "explore", "info", "interv"], "info": {"kicker": "open question", "q": "How much “iid-ness” must you give up to learn faster, and what does it cost your honest estimates?", "body": "Choosing data cleverly makes you learn faster but makes your estimates less honest. How far can the trade-off be pushed, and what does it cost? An open question I am working on.", "chips": [["Fields", ["Active Learning", "Bandits & RL", "Causal Inference"]], ["Roads", ["Exploration", "Information", "Intervention"]]]}}, {"id": "kevin", "type": "node", "label": "Certifying a configuration under capped runs", "x": 905, "y": 221, "shape": "star", "color": "mint", "size": 1.2, "tags": ["prog", "rl", "surv", "al", "censor", "budget", "explore"], "info": {"kicker": "in progress", "q": "How do you certify a near-best solver configuration with the least CPU, when slow runs get cut off?", "body": "With Kevin Leyton-Brown and Devon Graham: certifying a near-best solver configuration with the least CPU when slow runs are cut off. A capped run is a censored observation. In progress.", "chips": [["Fields", ["Bandits & RL", "Survival Analysis", "Active Learning"]], ["Roads", ["Censoring", "Budget & cost", "Exploration"]]]}}, {"id": "gcrl", "type": "node", "label": "Censored time-to-goal in RL", "x": 753, "y": 292, "shape": "star", "color": "pink", "size": 1.1, "tags": ["idea", "rl", "surv", "censor", "explore"], "info": {"kicker": "idea", "q": "Episodes that never reach the goal are censored “time to goal” data. Can survival thinking explain or improve exploration?", "body": "Episodes that never reach the goal are censored time-to-goal data. Can survival analysis explain or improve exploration in goal-conditioned reinforcement learning? An idea.", "chips": [["Fields", ["Bandits & RL", "Survival Analysis"]], ["Roads", ["Censoring", "Exploration"]]]}}, {"id": "spend", "type": "node", "label": "Spend compute where errors propagate", "x": 1019, "y": 856, "shape": "star", "color": "amber", "size": 1.2, "tags": ["rev", "hier", "minds", "budget", "abstr"], "info": {"kicker": "under review", "q": "How should a compute budget be split across a hierarchy of dependent decisions?", "body": "With Yashar Talebirad: how to split a compute budget across a hierarchy of decisions that depend on each other. Under review.", "chips": [["Fields", ["Hierarchy & Abstraction", "Minds & Agents"]], ["Roads", ["Budget & cost", "Abstraction"]]]}}, {"id": "ants", "type": "node", "label": "Is personalization worth it?", "x": 267, "y": 611, "shape": "star", "color": "mint", "size": 1.1, "tags": ["prog", "causal", "surv", "interv", "info"], "info": {"kicker": "in progress", "q": "Does a learned treatment rule beat one rule for everyone, and can the data even tell?", "body": "With Tina Sami: does a learned treatment rule beat one rule for everyone, and can observational data even tell? A doubly robust evaluation that declines to answer when the data cannot support a verdict. In progress.", "chips": [["Fields", ["Causal Inference", "Survival Analysis"]], ["Roads", ["Intervention", "Information"]]]}}, {"id": "oracle", "type": "node", "label": "Learning rates for human AIs", "x": 1213, "y": 419, "shape": "star", "color": "pink", "size": 1.1, "tags": ["idea", "minds", "rl", "al", "explore", "info", "abstr"], "info": {"kicker": "idea", "q": "When should a learner ask the oracle, and when should it explore alone, to learn fastest?", "body": "When should a learner ask an always-available expert, and when should it explore alone? Hints of increasing strength, and time-to-learn     const j = await r.json(); if (!j.ok && src !== 'ali') showToast({who: 'not done', cmd: j.error}, true); return j; }

/* ---------- ?selftest: drives the page like a person would and logs PASS/FAIL to the console ---------- */
async function selfTest() {
  const log = (ok, what) => console.log((ok ? 'SELFTEST PASS ' : 'SELFTEST FAIL ') + what);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const until = async (fn, ms = 3000) => { const t0 = Date.now(); while (Date.now() - t0 < ms) { if (fn()) return true; await sleep(30); } return false; };
  const scr = id => { const it = S.idx[id]; const r = svg.getBoundingClientRect(); return {x: r.left + it.x * S.cam.k + S.cam.x, y: r.top + it.y * S.cam.k + S.cam.y}; };
  const ev = (type, target, p) => target.dispatchEvent(new PointerEvent(type, {bubbles: true, clientX: p.x, clientY: p.y, button: 0, pointerId: 1, pointerType: 'mouse'}));
  const click = id => { const p = scr(id), tgt = S.el[id].querySelector('circle,rect,text'); ev('pointerdown', tgt, p); ev('pointerup', svg, p); };
  setMode('edit'); clearPicks(); await sleep(100);
  const nodes = S.scene.items.filter(i => i.type === 'node'); const [a, b] = nodes;
  click(a.id); click(b.id); await sleep(80);
  log(S.picks.length === 2 && S.picks[0].id === a.id && S.picks[1].id === b.id, 'clicking two nodes numbers them 1 and 2');
  log($('overlay').querySelectorAll('text').length === 2, 'two number badges are drawn');
  log(!$('insp').hidden && $('insp').textContent.includes(a.id), 'the picked list shows their ids');
  await sleep(150);
  const v0 = S.version, t0 = performance.now();
  const r = await send('arrow @1 @2 label="selftest"', 'ali');
  const got = await until(() => S.version > v0);
  const ms = Math.round(performance.now() - t0);
  const edge = S.scene.items.find(i => i.type === 'edge' && i.from === a.id && i.to === b.id && i.label === 'selftest');
  log(r.ok && got && !!edge, `arrow @1 @2 drew an arrow on screen (${ms} ms round trip)`);
  log(await until(() => S.picks.length === 0), 'the picks clear after the command used them');
  log(!!edge && !!S.el[edge.id] && !!S.el[edge.id].querySelector('.head'), 'the arrow has an arrowhead');
  const x0 = a.x, v1 = S.version, p = scr(a.id), tgt = S.el[a.id].querySelector('circle,rect,text');
  ev('pointerdown', tgt, p); for (let i = 1; i <= 6; i++) { ev('pointermove', svg, {x: p.x + i * 10, y: p.y}); await sleep(16); } ev('pointerup', svg, {x: p.x + 60, y: p.y});
  await until(() => S.version > v1);
  const moved = S.idx[a.id].x - x0, want = 60 / S.cam.k;
  log(Math.abs(moved - want) <= 2, `dragging a node 60px moves it by ${moved} (expected ${Math.round(want)})`);
  log(S.picks.length === 0, 'a drag does not pick');
  let v2 = S.version; await send('undo', 'ali'); await until(() => S.version < v2);
  log(S.idx[a.id].x === x0, 'undo puts the node back');
  v2 = S.version; await send('undo', 'ali'); await until(() => S.version < v2);
  log(!S.scene.items.some(i => i.label === 'selftest'), 'a second undo removes the arrow');
  const q = svg.getBoundingClientRect(); svg.dispatchEvent(new MouseEvent('dblclick', {bubbles: true, clientX: q.left + 30, clientY: q.top + q.height - 30}));
  log(S.picks.length === 1 && S.picks[0].x != null, 'double-clicking empty sky marks a spot');
  clearPicks(); setMode('view'); click(a.id); await sleep(80);
  log($('panel').classList.contains('open'), 'in View mode a click opens the info panel');
  window.dispatchEvent(new KeyboardEvent('keydown', {key: 'Escape'})); await sleep(50);
  log(!$('panel').classList.contains('open'), 'Esc closes it');
  setMode('edit');
  const bad = await send('colr @1 gold', 'ali');
  log(!bad.ok && /color/.test(bad.error || ''), 'a typo gets a helpful error: ' + (bad.error || ''));
  console.log('SELFTEST DONE');
}
</script>
